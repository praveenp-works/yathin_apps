name: Make app demo videos
on:
  workflow_dispatch:
    inputs:
      apps: { description: "apps to record", default: "plantdoc fridgechef classview yathin" }
  push:
    branches: [main]
    paths: [".github/workflows/app-videos.yml", "videos/src/**"]
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null; then
            curl -sL --retry 3 --max-time 180 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 && echo /tmp/ff/bin >> $GITHUB_PATH
          fi
          pip install playwright edge-tts && python -m playwright install chromium && (timeout 300 python -m playwright install-deps chromium || true)
      - name: Record narrated videos
        run: python videos/src/record.py
        env:
          VIDEO_APPS: ${{ inputs.apps || 'yathin' }}
      - name: Save videos to the repo
        run: |
          cp out/*.mp4 videos/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/*.mp4
          git commit -m "Update narrated app demo videos" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
