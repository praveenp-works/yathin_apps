<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"><title>Screen Read</title></head>
<body class="pop">

  <footer>Free, reads on your device · <a href="https://praveenp-works.github.io/yathin_apps/screenread/" target="_blank">Yathin Looops</a></footer>
