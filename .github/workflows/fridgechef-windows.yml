name: Build FridgeChef.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fridgechef/**", "fridgechef-windows/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install -U pyinstaller pywebview
      - name: Stage web files
        shell: bash
        run: mkdir -p build_web/web && cp fridgechef/* build_web/web/
      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name FridgeChef --icon fridgechef-windows/FridgeChef.ico --add-data "build_web/web;web" fridgechef-windows/fridge_chef.pyw
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fridgechef-windows --yes --cleanup-tag || true
          gh release create fridgechef-windows dist/FridgeChef.exe --title "Fridge Chef for Windows" --notes "Fridge Chef for Windows 10 and 11. Snap or upload a fridge photo and get recipes. Created by Yathin Pedamallu." --latest=false
