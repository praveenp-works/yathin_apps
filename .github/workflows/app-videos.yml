name: Make app demo videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/app-videos.yml", "videos/src/**"]
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install playwright edge-tts && python -m playwright install --with-deps chromium
      - name: Record narrated videos
        run: python videos/src/record.py
      - name: Save videos to the repo
        run: |
          cp out/*.mp4 videos/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/*.mp4
          git commit -m "Update narrated app demo videos" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
