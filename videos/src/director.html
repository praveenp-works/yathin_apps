<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Poppins,"DejaVu Sans",sans-serif;color:#fff}
#bg{position:fixed;inset:0;background:var(--bg)}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(1400px 900px at 50% 45%,transparent 35%,rgba(0,0,0,.4))}
#glow{position:fixed;inset:0;opacity:.25;background:radial-gradient(800px 520px at 50% 50%,rgba(255,255,255,.4),transparent 70%);animation:br 6s ease-in-out infinite alternate}
@keyframes br{to{transform:scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .5s ease}
.layer.on{opacity:1}
/* hook */
.hl{font-size:100px;font-weight:800;line-height:1.12;letter-spacing:-.02em;text-shadow:0 6px 40px rgba(0,0,0,.35);opacity:0;position:relative}
.hl.in{animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
.hl.dim{color:rgba(255,255,255,.55)}
.hl:after{content:"";position:absolute;left:-2%;top:55%;height:9px;width:0;background:#ff4d4d;border-radius:6px;transition:width .35s ease}
.hl.strike:after{width:104%}
/* window */
#win{width:1240px;height:720px;border-radius:26px;background:#15151d;box-shadow:0 50px 140px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);overflow:hidden;position:relative;text-align:left}
.tb{height:46px;display:flex;align-items:center;gap:9px;padding:0 18px;background:#1d1d27;color:#b8b8c8;font-size:17px;font-weight:600}
.tb i{width:13px;height:13px;border-radius:50%;display:inline-block}
.tb img{width:24px;height:24px;border-radius:6px;margin-left:14px}
.body{position:absolute;inset:46px 0 0 0;padding:34px 40px}
.h{font-size:34px;font-weight:700;margin:0 0 20px}
.muted{color:#9a9ab0}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;background:var(--btn);color:#fff;font-weight:700;font-size:22px;transition:transform .15s}
.btn.press{transform:scale(.92)}
.card{background:#20202b;border-radius:20px;padding:22px 24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.hide{opacity:0}
.popin{animation:pop .45s cubic-bezier(.2,.8,.2,1) forwards}
.upin{animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
.chip{display:inline-block;padding:10px 20px;border-radius:999px;background:#2a2a38;font-size:22px;font-weight:600;margin:0 10px 12px 0}
/* photo + scan */
.photo{position:relative;border-radius:18px;overflow:hidden;background:#262631}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.scan{position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(120,255,170,.45),transparent);border-bottom:3px solid rgba(160,255,200,.9)}
.scan.go{animation:scan 1.4s ease-in-out 2}
@keyframes scan{to{top:100%}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
/* gauge */
.gauge{height:22px;border-radius:12px;background:linear-gradient(90deg,#ef4444,#f59e0b,#eab308,#22c55e);position:relative;margin:18px 0 8px}
.knob{position:absolute;top:-9px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5);left:0;transition:left 1.6s cubic-bezier(.2,.8,.2,1)}
/* cursor */
#cur{position:fixed;left:1500px;top:900px;width:46px;height:46px;z-index:50;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#cur .rip{position:absolute;left:-22px;top:-22px;width:50px;height:50px;border-radius:50%;border:4px solid #fff;opacity:0}
#cur .rip.go{animation:rip .5s ease-out}
@keyframes rip{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
/* caption pill */
#pill{position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(20px);padding:16px 34px;border-radius:999px;background:rgba(10,10,16,.78);font-size:30px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .35s,transform .35s;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#pill.on{opacity:1;transform:translateX(-50%)}
/* tiles (classview) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{border-radius:14px;background:#20202b;padding:10px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .3s}
.tile .scr{height:92px;border-radius:9px;background:var(--c);position:relative;overflow:hidden}
.tile .scr:before,.tile .scr:after{content:"";position:absolute;left:12px;right:30%;height:9px;border-radius:5px;background:rgba(255,255,255,.55);top:16px}
.tile .scr:after{top:34px;right:45%}
.tile .nm{font-size:17px;font-weight:600;margin-top:8px;display:flex;justify-content:space-between}
.tile .url{font-size:14px;color:#9a9ab0}
.tile.bad{box-shadow:inset 0 0 0 3px #ef4444}
.tile .lock{position:absolute;inset:0;background:rgba(10,10,20,.82);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;opacity:0;transition:opacity .4s}
.tile.locked .lock{opacity:1}
.toast{position:absolute;right:30px;top:70px;width:420px;padding:18px 20px;border-radius:16px;background:#2b1d22;box-shadow:inset 0 0 0 2px #ef4444,0 20px 40px rgba(0,0,0,.5);font-size:20px;opacity:0}
/* end */
#end .icon{width:230px;height:230px;border-radius:52px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#end h1{font-size:150px;margin:26px 0 0;font-weight:800;letter-spacing:-.03em;text-shadow:0 6px 40px rgba(0,0,0,.35)}
#end .tag{font-size:50px;font-weight:600;margin:6px 0 48px}
#end .chips{display:flex;gap:26px}
#end .chips span{font-size:38px;font-weight:600;padding:18px 38px;border-radius:999px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
#end .foot{margin-top:64px;font-size:34px;color:rgba(255,255,255,.85)}
#end>*{opacity:0}
#end.on>*{animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
#end.on>*:nth-child(2){animation-delay:.12s}#end.on>*:nth-child(3){animation-delay:.24s}#end.on>*:nth-child(4){animation-delay:.36s}#end.on>*:nth-child(5){animation-delay:.48s}
/* vertical 9:16 */
html.v,html.v body{width:1080px;height:1920px}
html.v #win{width:960px;height:1250px}
html.v .tb{height:64px;font-size:26px}html.v .tb img{width:34px;height:34px}html.v .tb i{width:17px;height:17px}
html.v .body{inset:64px 0 0 0;padding:44px 46px}
html.v .h{font-size:46px}
html.v .grid{grid-template-columns:repeat(2,1fr);gap:22px}
html.v .tile .scr{height:150px}html.v .tile .nm{font-size:26px}
html.v .hl{font-size:130px}html.v #hook .hl:last-child{color:#ffd60a}
html.v #pill{bottom:150px;font-size:42px;white-space:normal;width:max-content;max-width:960px;text-align:center;padding:20px 40px}
html.v #end h1{font-size:130px}html.v #end .tag{font-size:54px}
html.v #end .chips{flex-wrap:wrap;justify-content:center;max-width:960px;gap:22px}
html.v #end .foot{font-size:32px}
html.v #bg:after{display:none}
html.v #pill{background:#111;color:#fff;box-shadow:inset 0 -7px 0 #ffd60a,0 10px 30px rgba(0,0,0,.25)}
html.v #hook{justify-content:flex-start;padding-top:330px}
html.v #end{justify-content:flex-end;padding-bottom:300px}
html.v #end h1{color:#111;text-shadow:none}html.v #end .tag{color:#333}
html.v #end .chips span{background:#111;color:#fff;box-shadow:none}html.v #end .chips span:first-child{background:#ffd60a;color:#111}
html.v #end .foot{color:#d90429;font-weight:700}
html.v #cur{left:900px;top:1700px}
</style></head>

async function cursorTo(sel, ms = 900){ const el = typeof sel === "string" ? q(sel) : sel; if (!el) return; const r = el.getBoundingClientRect(); const c = $("cur"); c.style.opacity = 1; c.style.transitionDuration = ms + "ms"; c.style.left = (r.left + r.width / 2 - 6) + "px"; c.style.top = (r.top + r.height / 2 - 4) + "px"; await sleep(ms + 80); }

function popAll(sel, gap = 140, cls = "popin"){ return (async () => { for (const e of wb().querySelectorAll(sel)){ e.classList.add(cls); await sleep(gap); } })(); }

const app = new URLSearchParams(location.search).get("app");
const S = SCRIPTS[app];
if (S.vertical) document.documentElement.classList.add("v");
document.documentElement.style.setProperty("--bg", S.bg);
document.documentElement.style.setProperty("--btn", S.btn);
// lines for narration (read by record.py)
S.lines = S.scenes.map(s => s.say);
window.__marks = [];
window.start = async function(durs){
  const t0 = performance.now(); let gridHTML = "";
  $("tbIcon").src = S.icon; $("tbTitle").textContent = S.title;
  $("endIcon").src = S.icon; if (S.icons) $("endIcon").outerHTML = `<div style="display:flex;gap:${S.vertical?24:30}px">${S.icons.map(i=>`<img class="icon" style="width:170px;height:170px;border-radius:40px;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.45)" src="${i}">`).join("")}</div>`; $("endTitle").textContent = S.title; $("endTag").textContent = S.tag;
  $("endChips").innerHTML = S.chips.map(c => `<span>${c}</span>`).join(""); $("endFoot").textContent = S.foot;
  for (let i = 0; i < S.scenes.length; i++){
    const sc = S.scenes[i], need = (durs[i] || 0) * 1000 + 500;
    window.__marks.push(performance.now() - t0);
    if (sc.hook){
      const h = $("hook"); h.innerHTML = sc.hook.map(l => `<div class="hl">${l}</div>`).join(""); h.classList.add("on");
      const ls = [...h.children], per = Math.max(450, (need - 1000) / ls.length);
      for (const l of ls){ l.classList.add("in"); await sleep(per); }
      if (sc.strike){ for (const l of ls.slice(0, -1)){ l.classList.add("strike"); await sleep(180); } }
      else ls.slice(0, -1).forEach(l => l.classList.add("dim"));
      await sleep(900); h.classList.remove("on"); await sleep(450);
    } else if (sc.end){
      $("pill").classList.remove("on"); $("stage").classList.remove("on"); await sleep(400);
      $("end").classList.add("on"); await sleep(Math.max(need, 4200) + 1300);
    } else {
      const st = performance.now(); window.__need = need;
      if (sc.tb){ $("tbIcon").src = sc.tb[0]; $("tbTitle").textContent = sc.tb[1]; }
      $("pill").classList.remove("on");
      if (!sc.keep){
        if (sc.html === "__grid") wb().innerHTML = gridHTML; else wb().innerHTML = sc.html;
        if (wb().querySelector(".grid")) gridHTML = wb().innerHTML;
        const w = $("win"); w.classList.remove("upin"); void w.offsetWidth; w.classList.add("upin");
      }
      $("stage").classList.add("on");
      setTimeout(() => { $("pill").textContent = sc.pill; $("pill").classList.add("on"); }, 350);
      await sc.run();
      const left = need - (performance.now() - st); if (left > 0) await sleep(left);
    }
  }
  window.__total = performance.now() - t0;
  window.__done = true;
};
</script>
